repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-plastier_logo_light.png
    - docs/images/nf-core-plastier_logo_light.png
    - docs/images/nf-core-plastier_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
    - docs/CONTRIBUTING.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-plastier_logo_light.png
    - docs/images/nf-core-plastier_logo_light.png
    - docs/images/nf-core-plastier_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - conf/igenomes.config
    - conf/igenomes_ignored.config

template:
  org: plastier
  name: plastier
  description: Confidence-tiered plasmid attribution of AMR genes from public bacterial
    short reads
  author: Daniel Garbozo
  version: 0.1.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - gpu
    - email
    - seqera_platform
    - codespaces
  is_nfcore: false
